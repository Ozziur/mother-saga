name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # per pubblicare le release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # L'SDK Android è già presente sui runner di GitHub: aggiungo solo la piattaforma.
      - name: Installa la piattaforma Android 36
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mother-saga-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # Ogni versione nuova (versionName in android/app/build.gradle) diventa una release:
      # l'app la trova da sola e propone l'aggiornamento.
      - name: Pubblica la release se la versione è nuova
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" android/app/build.gradle)
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "La release v$VERSION esiste già: niente da pubblicare."
            exit 0
          fi
          cp android/app/build/outputs/apk/release/app-release.apk mother-saga.apk
          git log -1 --pretty=%B | sed '/^Co-Authored-By:/d;/^Claude-Session:/d' > notes.md
          gh release create "v$VERSION" mother-saga.apk --title "Mother Saga $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
